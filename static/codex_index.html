<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codex Transcript Browser</title>
  <link rel="stylesheet" href="/codex_style.css" />
  <!-- markdown + sanitization, loaded from CDN; falls back to plain text if offline -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div class="brand">
          <span class="brand-mark">C</span>
          <span>Codex Transcripts</span>
          <button id="refresh" class="btn" title="Rescan ~/.codex/sessions for new sessions">Refresh</button>
        </div>
        <input id="search" type="search" placeholder="Search sessions or id..." autocomplete="off" />
        <div id="sidebar-stats" class="muted"></div>
      </div>
      <div id="session-list"></div>
    </aside>

    <main id="main">
      <div id="welcome" class="welcome">
        <h1>Codex Transcript Browser</h1>
        <p class="muted">Select a session from the left to view the saved Codex event log.</p>
        <ul class="legend">
          <li><span class="dot dot-user"></span> User</li>
          <li><span class="dot dot-assistant"></span> Assistant</li>
          <li><span class="dot dot-thinking"></span> Reasoning</li>
          <li><span class="dot dot-tool"></span> Tool</li>
        </ul>
      </div>
      <div id="transcript" hidden></div>
    </main>
  </div>
  <script src="/codex_app.js"></script>
</body>
</html>
