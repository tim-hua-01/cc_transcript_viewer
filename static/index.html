<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transcript Viewer</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- markdown + sanitization, loaded from CDN; falls back to plain text if offline -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <!-- KaTeX for inline / display math; falls back to raw $…$ if offline -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">Transcript Viewer</span>
          <button id="collapse-sidebar" class="panel-collapse" title="Hide sessions panel">«</button>
        </div>
        <input id="search" type="search" placeholder="Search title, project, or id…" autocomplete="off" />
        <div id="filter-row">
          <button class="filter-chip on" data-agent="all">All</button>
          <button class="filter-chip" data-agent="claude">Claude</button>
          <button class="filter-chip" data-agent="codex">Codex</button>
        </div>
        <div id="filter-dropdowns"></div>
        <div id="sidebar-stats" class="muted"></div>
      </div>
      <div id="session-list"></div>
    </aside>

    <main id="main">
      <div id="welcome" class="welcome">
        <h1>Transcript Viewer</h1>
        <p class="muted">Claude Code and Codex sessions, newest first. Select one on the
          left to view the full conversation — every prompt, response, thought, and tool call.</p>
        <ul class="legend">
          <li><span class="dot dot-user"></span> User prompt</li>
          <li><span class="dot dot-assistant"></span> Assistant reply</li>
          <li><span class="dot dot-thinking"></span> Thinking / reasoning</li>
          <li><span class="dot dot-tool"></span> Tool call</li>
        </ul>
      </div>
      <div id="transcript" hidden></div>
      <div id="nav-buttons" hidden>
        <button id="nav-prev" class="nav-btn" title="Previous user message">↑</button>
        <button id="nav-next" class="nav-btn" title="Next user message">↓</button>
        <button id="nav-end" class="nav-btn" title="Scroll to end">⤓</button>
      </div>
    </main>

    <aside id="outline" hidden>
      <div id="outline-header">
        <span>User messages</span>
        <button id="collapse-outline" class="panel-collapse" title="Hide outline panel">»</button>
      </div>
      <div id="outline-list"></div>
    </aside>

    <button id="show-sidebar" class="edge-toggle left" title="Show sessions panel">»</button>
    <button id="show-outline" class="edge-toggle right" title="Show outline panel">«</button>
  </div>
  <script src="/app.js"></script>
</body>
</html>
